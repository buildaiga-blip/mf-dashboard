name: Refresh Regulatory Updates

on:
  schedule:
    # Every 6 hours — announcements are time-sensitive, unlike fund NAVs which only change daily
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regulatory updates refresh
        run: python fetch_regulatory_updates.py

      - name: Commit updated regulatory_updates.json
        run: |
          git config user.name "mf-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/regulatory_updates.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Refresh regulatory updates $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
